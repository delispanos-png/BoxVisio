# Static asset caching policy (PERFORMANCE_AUDIT_2026-07.md §7)
#
# http-level context (loaded from /etc/nginx/conf.d/).
#
# Assets referenced with a ?v=... cache-buster in the templates are immutable for
# that version, so they get a one-year lifetime. Anything without a version tag
# keeps a short lifetime so that editing a file under backend/app/static/ still
# reaches users promptly — the working tree serves production directly.
map $arg_v $bv_static_cache_control {
    default   "public, max-age=900";
    "~.+"     "public, max-age=31536000, immutable";
}
