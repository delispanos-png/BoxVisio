server {
    listen 80;
    listen [::]:80;
    server_name bi.boxvisio.com;

    include /etc/nginx/conf.d/common_security.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api_upstream/metrics;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bi.boxvisio.com;
    client_max_body_size 128m;

    include /etc/nginx/conf.d/common_security.conf;

    ssl_certificate /etc/letsencrypt/live/bi.boxvisio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.boxvisio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api_upstream/metrics;
    }

    # Served straight off disk: skips the proxy hop and the whole ASGI
    # middleware chain that StaticFiles would otherwise run per asset.
    location /static/ {
        alias /opt/cloudon-bi/backend/app/static/;
        access_log off;
        # add_header in a location resets the ones inherited from the server
        # block, so the security headers are restated here.
        add_header Cache-Control $bv_static_cache_control always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/ {
        rewrite ^/api/auth/(.*)$ /v1/auth/$1 break;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://api_upstream;
    }

    location / {
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://frontend_upstream;
    }
}
