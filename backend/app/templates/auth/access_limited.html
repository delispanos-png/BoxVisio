<!doctype html>
<html lang="{{ request.cookies.get('lang', 'el') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — BoxVisio</title>
  <link rel="icon" href="/static/brand/boxvisio-mark.svg?v=20260528logo1" type="image/svg+xml">
  <style>
    :root { --bg-1:#0ea5b7; --bg-2:#1597c8; --panel:#fff; --text:#0f172a; --muted:#5b6777; --warn:#b45309; --danger:#dc2626; --primary:#0d6efd; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.26) 0, rgba(255,255,255,0) 34%), linear-gradient(135deg, var(--bg-1), var(--bg-2));
      font-family:"Segoe UI","Noto Sans",sans-serif; color:var(--text); }
    .card { background:var(--panel); width:100%; max-width:520px; border-radius:18px; padding:36px 34px;
      box-shadow:0 24px 60px rgba(2,20,40,.28); text-align:center; }
    .icon { width:64px; height:64px; margin:6px auto 18px; border-radius:50%; display:grid; place-items:center; font-size:30px;
      background:{% if kind == 'agent' %}#fdeaea; color:var(--danger){% else %}#fef3c7; color:var(--warn){% endif %}; }
    h1 { font-size:22px; margin:0 0 10px; }
    p { color:var(--muted); font-size:14.5px; line-height:1.6; margin:0 0 14px; }
    .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
    a.btn { display:inline-block; padding:10px 18px; border-radius:10px; text-decoration:none; font-weight:600; font-size:14px; }
    a.primary { background:var(--primary); color:#fff; }
    a.ghost { border:1px solid #cbd5e1; color:var(--text); }
    small { display:block; margin-top:16px; color:#94a3b8; font-size:12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">{% if kind == 'agent' %}&#9888;{% else %}&#9203;{% endif %}</div>
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    <div class="actions">
      {% if kind != 'agent' %}<a class="btn ghost" href="javascript:history.back()">Πίσω</a>{% endif %}
      <a class="btn primary" href="/tenant/copilot">Άνοιγμα Co-Pilot</a>
    </div>
    <small>BoxVisio · Αν πιστεύετε ότι πρόκειται για λάθος, επικοινωνήστε με την υποστήριξη της CloudOn.</small>
  </div>
</body>
</html>
