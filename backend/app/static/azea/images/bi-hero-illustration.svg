<svg width="480" height="340" viewBox="0 0 480 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barTeal" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip1"><rect x="20" y="20" width="440" height="300" rx="16"/></clipPath>
  </defs>

  <!-- Main dashboard card -->
  <rect x="20" y="20" width="440" height="300" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="440" height="36" rx="16" fill="#0f172a" fill-opacity="0.8"/>
  <rect x="20" y="42" width="440" height="14" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="44" cy="38" r="5" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="60" cy="38" r="5" fill="#f59e0b" fill-opacity="0.7"/>
  <circle cx="76" cy="38" r="5" fill="#22c55e" fill-opacity="0.7"/>
  <text x="200" y="43" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="1">BOXVISIO ANALYTICS</text>

  <!-- KPI cards row -->
  <!-- Card 1 -->
  <rect x="32" y="68" width="126" height="64" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e3a5f" stroke-width="1"/>
  <text x="44" y="86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#64748b" letter-spacing="0.5">ΠΩΛΗΣΕΙΣ</text>
  <text x="44" y="104" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">€84.2K</text>
  <text x="44" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#34d399">▲ 12.4%</text>

  <!-- Card 2 -->
  <rect x="170" y="68" width="126" height="64" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#2d1b69" stroke-width="1"/>
  <text x="182" y="86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#64748b" letter-spacing="0.5">ΣΥΝΑΛΛΑΓΕΣ</text>
  <text x="182" y="104" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#a78bfa">3,847</text>
  <text x="182" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#34d399">▲ 8.1%</text>

  <!-- Card 3 -->
  <rect x="308" y="68" width="132" height="64" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#064e3b" stroke-width="1"/>
  <text x="320" y="86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#64748b" letter-spacing="0.5">ΜΕΣΟΣ ΟΡΟΣ</text>
  <text x="320" y="104" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#34d399">€21.9</text>
  <text x="320" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#f87171">▼ 2.3%</text>

  <!-- Bar chart area -->
  <rect x="32" y="146" width="240" height="152" rx="10" fill="#0f172a" fill-opacity="0.5" stroke="#1e293b" stroke-width="1"/>
  <text x="44" y="163" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#64748b" letter-spacing="0.5">ΠΩΛΗΣΕΙΣ ΑΝΑ ΜΗΝΑ</text>

  <!-- Grid lines -->
  <line x1="44" y1="175" x2="260" y2="175" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="44" y1="195" x2="260" y2="195" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="44" y1="215" x2="260" y2="215" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="44" y1="235" x2="260" y2="235" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="44" y1="255" x2="260" y2="255" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="44" y1="275" x2="260" y2="275" stroke="#334155" stroke-width="0.8"/>

  <!-- Bars -->
  <rect x="52"  y="225" width="18" height="50" rx="4" fill="url(#barBlue)" opacity="0.9"/>
  <rect x="78"  y="210" width="18" height="65" rx="4" fill="url(#barBlue)" opacity="0.9"/>
  <rect x="104" y="230" width="18" height="45" rx="4" fill="url(#barPurple)" opacity="0.9"/>
  <rect x="130" y="200" width="18" height="75" rx="4" fill="url(#barBlue)" opacity="0.9"/>
  <rect x="156" y="215" width="18" height="60" rx="4" fill="url(#barPurple)" opacity="0.9"/>
  <rect x="182" y="185" width="18" height="90" rx="4" fill="url(#barBlue)" opacity="0.9"/>
  <rect x="208" y="205" width="18" height="70" rx="4" fill="url(#barTeal)" opacity="0.9"/>
  <rect x="234" y="190" width="18" height="85" rx="4" fill="url(#barBlue)" opacity="0.9"/>

  <!-- Month labels -->
  <text x="61"  y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΙΑΝ</text>
  <text x="87"  y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΦΕΒ</text>
  <text x="113" y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΜΑΡ</text>
  <text x="139" y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΑΠΡ</text>
  <text x="165" y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΜΑΙ</text>
  <text x="191" y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΙΟΥ</text>
  <text x="217" y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΙΟΥ</text>
  <text x="243" y="287" font-family="Arial" font-size="7" fill="#475569" text-anchor="middle">ΑΥΓ</text>

  <!-- Line chart area -->
  <rect x="284" y="146" width="156" height="152" rx="10" fill="#0f172a" fill-opacity="0.5" stroke="#1e293b" stroke-width="1"/>
  <text x="296" y="163" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" fill="#64748b" letter-spacing="0.5">TREND</text>

  <!-- Line chart grid -->
  <line x1="296" y1="180" x2="428" y2="180" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="296" y1="205" x2="428" y2="205" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="296" y1="230" x2="428" y2="230" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="296" y1="255" x2="428" y2="255" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="296" y1="275" x2="428" y2="275" stroke="#334155" stroke-width="0.8"/>

  <!-- Area fill under line -->
  <path d="M300 265 L322 248 L344 255 L366 230 L388 218 L410 200 L428 188 L428 275 L300 275 Z" fill="url(#lineGlow)" fill-opacity="0.08"/>

  <!-- Line -->
  <path d="M300 265 L322 248 L344 255 L366 230 L388 218 L410 200 L428 188" stroke="url(#lineGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Dots on line -->
  <circle cx="300" cy="265" r="3.5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="322" cy="248" r="3.5" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="344" cy="255" r="3.5" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="366" cy="230" r="3.5" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="388" cy="218" r="3.5" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="410" cy="200" r="3.5" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="428" cy="188" r="3.5" fill="#c084fc" filter="url(#glow)"/>

  <!-- Tooltip on last point -->
  <rect x="402" y="172" width="46" height="22" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
  <text x="425" y="187" font-family="Arial" font-size="8" fill="#a5b4fc" text-anchor="middle" font-weight="700">€84.2K</text>
</svg>
