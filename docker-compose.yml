services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - authentication_timeout=15s
      - -c
      - idle_session_timeout=10min
      - -c
      - idle_in_transaction_session_timeout=5min
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      # --- Performance tuning (PERFORMANCE_AUDIT_2026-07.md §1) ---
      # Host: 12 vCPU / 22 GB RAM, ~80 GB of tenant data, OLAP/BI workload.
      # Stock defaults left the cache hit ratio at 72% and spilled 5.8 TB to temp files.
      # Sized to hold the whole working set: the heaps of all tenants total
      # ~7.9 GB. It also lifts the sequential-scan ring-buffer threshold
      # (shared_buffers/4) to 2.5 GB, above fact_sales' 1718 MB heap — below that
      # threshold Postgres scans large tables through a 256 KB ring and never
      # caches them, which pinned the hit ratio at ~12% however often they were read.
      - -c
      - shared_buffers=10GB
      - -c
      - effective_cache_size=18GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=12
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - wal_buffers=64MB
      - -c
      - min_wal_size=2GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - default_statistics_target=200
      # Measured on the dashboard's monthly rollup: JIT spent ~545 ms compiling
      # for a ~1.2 s query and was consistently ~10% slower than without it.
      # This workload is many mid-sized queries, where compilation never pays off.
      - -c
      - jit=off
      # Each uvicorn worker keeps its own pool per tenant engine plus control;
      # 4 workers need materially more headroom than the stock 100.
      - -c
      - max_connections=300
      # Aggregate rebuilds churn millions of rows; the stock cost limit cannot keep up.
      - -c
      - autovacuum_max_workers=4
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_cost_limit=2000
      # --- Observability (§10) ---
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${TENANT_DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${TENANT_DB_SUPERPASS:-postgres}
      POSTGRES_DB: ${CONTROL_DB_NAME:-bi_control}
      TZ: Europe/Athens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TENANT_DB_SUPERUSER:-postgres} -d ${CONTROL_DB_NAME:-bi_control}"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - bi_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory was unset with policy noeviction: a growing KPI cache could push
    # Redis until writes started failing. volatile-lru (not allkeys-lru) is the
    # only safe choice here because Redis is also the Celery broker — queued task
    # messages carry no TTL, so they can never be evicted, while the KPI cache,
    # rate-limit counters and ingest state all set one.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - bi_net

  api:
    image: python:3.12-slim-bookworm
    working_dir: /opt/cloudon-bi/backend
    command:
      - /bin/sh
      - -lc
      # 4 workers: the API ran as a single process on a 12-core host, so one slow
      # query blocked every other request behind it. All shared state (rate limit,
      # KPI cache, sessions) lives in Redis, so workers need no affinity.
      - ln -sf /usr/local/bin/python /usr/bin/python3 && exec /opt/cloudon-bi/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/cloudon-bi/backend
      TZ: Europe/Athens
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - /opt/cloudon-bi:/opt/cloudon-bi
      - /lib/x86_64-linux-gnu/libc.so.6:/lib/x86_64-linux-gnu/libc.so.6:ro
      - /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2:/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2:ro
      - /lib/x86_64-linux-gnu/libodbc.so.2:/lib/x86_64-linux-gnu/libodbc.so.2:ro
      - /lib/x86_64-linux-gnu/libodbcinst.so.2:/lib/x86_64-linux-gnu/libodbcinst.so.2:ro
      - /lib/x86_64-linux-gnu/libltdl.so.7:/lib/x86_64-linux-gnu/libltdl.so.7:ro
      - /opt/microsoft/msodbcsql18:/opt/microsoft/msodbcsql18:ro
      - /etc/odbcinst.ini:/etc/odbcinst.ini:ro
    expose:
      - "8000"
    networks:
      - bi_net

  worker:
    image: python:3.12-slim-bookworm
    working_dir: /opt/cloudon-bi
    command:
      - /bin/sh
      - -lc
      - ln -sf /usr/local/bin/python /usr/bin/python3 && exec /opt/cloudon-bi/.venv/bin/celery -A worker.celery_app worker -l INFO -Q celery,default,ingest -c 2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/cloudon-bi/backend:/opt/cloudon-bi
      TZ: Europe/Athens
      # Give each drain cycle enough headroom for 3 query-timeout retries
      # (3 × SQLSERVER_QUERY_TIMEOUT_SECONDS=180s = 540s) before SIGKILL fires.
      INGEST_AUTO_RECOVER_FORCE_SECONDS: "1200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/cloudon-bi/.venv/bin/celery -A worker.celery_app inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || pgrep -f 'celery.*worker' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /opt/cloudon-bi:/opt/cloudon-bi
      - /lib/x86_64-linux-gnu/libc.so.6:/lib/x86_64-linux-gnu/libc.so.6:ro
      - /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2:/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2:ro
      - /lib/x86_64-linux-gnu/libodbc.so.2:/lib/x86_64-linux-gnu/libodbc.so.2:ro
      - /lib/x86_64-linux-gnu/libodbcinst.so.2:/lib/x86_64-linux-gnu/libodbcinst.so.2:ro
      - /lib/x86_64-linux-gnu/libltdl.so.7:/lib/x86_64-linux-gnu/libltdl.so.7:ro
      - /opt/microsoft/msodbcsql18:/opt/microsoft/msodbcsql18:ro
      - /etc/odbcinst.ini:/etc/odbcinst.ini:ro
    networks:
      - bi_net

  worker_delete:
    image: python:3.12-slim-bookworm
    working_dir: /opt/cloudon-bi
    command:
      - /bin/sh
      - -lc
      - ln -sf /usr/local/bin/python /usr/bin/python3 && exec /opt/cloudon-bi/.venv/bin/celery -A worker.celery_app worker -l INFO -Q delete -c 1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/cloudon-bi/backend:/opt/cloudon-bi
      TZ: Europe/Athens
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/cloudon-bi/.venv/bin/celery -A worker.celery_app inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || pgrep -f 'celery.*worker' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /opt/cloudon-bi:/opt/cloudon-bi
      - /lib/x86_64-linux-gnu/libc.so.6:/lib/x86_64-linux-gnu/libc.so.6:ro
      - /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2:/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2:ro
      - /lib/x86_64-linux-gnu/libodbc.so.2:/lib/x86_64-linux-gnu/libodbc.so.2:ro
      - /lib/x86_64-linux-gnu/libodbcinst.so.2:/lib/x86_64-linux-gnu/libodbcinst.so.2:ro
      - /lib/x86_64-linux-gnu/libltdl.so.7:/lib/x86_64-linux-gnu/libltdl.so.7:ro
      - /opt/microsoft/msodbcsql18:/opt/microsoft/msodbcsql18:ro
      - /etc/odbcinst.ini:/etc/odbcinst.ini:ro
    networks:
      - bi_net

  worker_beat:
    image: python:3.12-slim-bookworm
    working_dir: /opt/cloudon-bi
    command:
      - /bin/sh
      - -lc
      - ln -sf /usr/local/bin/python /usr/bin/python3 && exec /opt/cloudon-bi/.venv/bin/celery -A worker.celery_app beat -l INFO
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/cloudon-bi/backend:/opt/cloudon-bi
      TZ: Europe/Athens
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'celery'"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /opt/cloudon-bi:/opt/cloudon-bi
    networks:
      - bi_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TZ: Europe/Athens
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./infra/nginx/upstreams.conf:/etc/nginx/conf.d/upstreams.conf:ro
      - ./infra/nginx/common_security.conf:/etc/nginx/conf.d/common_security.conf:ro
      - ./infra/nginx/static_cache.conf:/etc/nginx/conf.d/static_cache.conf:ro
      - ./backend/app/static:/opt/cloudon-bi/backend/app/static:ro
      - ./infra/nginx/bi.boxvisio.com.conf:/etc/nginx/conf.d/bi.boxvisio.com.conf:ro
      - ./infra/nginx/adminpanel.boxvisio.com.conf:/etc/nginx/conf.d/adminpanel.boxvisio.com.conf:ro
      - ./infra/nginx/admin_allowlist.conf:/etc/nginx/snippets/admin_allowlist.conf:ro
      - ./infra/certbot/www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - bi_net

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  bi_net:
    driver: bridge
